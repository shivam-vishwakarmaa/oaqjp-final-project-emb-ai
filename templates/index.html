<!DOCTYPE html>
<html>
<head><title>Emotion Detector</title></head>
<body>
  <h1>Emotion Detector</h1>
  <input type="text" id="textToAnalyze" />
  <button onclick="runSentiment()">Analyze</button>
  <div id="response_div"></div>
  <script>
    function runSentiment() {
        let text = document.getElementById("textToAnalyze").value;
        fetch('/emotionDetector?textToAnalyze=' + encodeURIComponent(text))
            .then(res => res.text())
            .then(data => { document.getElementById("response_div").innerHTML = data; });
    }
  </script>
</body>
</html>
